name: Publish Anira Release

on:
  push:
    branches: [main]
    paths:
      - 'downloads/*.apk'
      - 'downloads/SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public distribution files
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPO.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Read release metadata and verify APK
        id: release
        run: |
          VERSION="$(jq -r '.version' version.json)"
          APK="$(jq -r '.apk' version.json)"
          test -n "$VERSION"
          test -f "$APK"
          (cd downloads && sha256sum --check SHA256SUMS)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          APK: ${{ steps.release.outputs.apk }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" downloads/SHA256SUMS --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest --title "Anira $VERSION" --notes-file RELEASE-NOTES.md
          else
            gh release create "$TAG" "$APK" downloads/SHA256SUMS --target "$COMMIT" --title "Anira $VERSION" --notes-file RELEASE-NOTES.md --latest
          fi
